<head>

<title>小宝 · Merry Christmas</title>
<style>
html,body{margin:0;height:100%;background:#07030a;overflow:hidden;overscroll-behavior:none;
 -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
 font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
 background:radial-gradient(ellipse at 50% 45%,rgba(40,12,32,.35),rgba(6,2,9,.78) 70%);
 transition:opacity 1.4s ease,visibility 1.4s;z-index:5;cursor:pointer}
#ov.hide{opacity:0;visibility:hidden}
#ov .mc{font-family:Georgia,"Times New Roman",serif;font-style:italic;color:#f3d7b6;letter-spacing:.12em;
 font-size:clamp(26px,8vw,46px);text-shadow:0 0 18px rgba(255,170,200,.55);margin-bottom:8vh;opacity:.92}
#btn{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;
 background:radial-gradient(circle,rgba(255,214,170,.28),rgba(255,150,190,.08) 55%,transparent 72%);
 animation:pulse 2.6s ease-in-out infinite}
#btn svg{width:46px;height:46px;filter:drop-shadow(0 0 10px rgba(255,205,150,.9)) drop-shadow(0 0 22px rgba(255,140,190,.6))}
#ov .t{margin-top:22px;color:#fbe6ea;font-size:17px;letter-spacing:.32em;text-indent:.32em;text-shadow:0 0 12px rgba(255,150,190,.7)}
#ov .s{margin-top:12px;color:rgba(250,220,225,.5);font-size:12px;letter-spacing:.2em}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.12);opacity:1}}
#hint{position:fixed;left:0;right:0;bottom:calc(7vh + env(safe-area-inset-bottom));text-align:center;z-index:3;pointer-events:none;
 color:#fde9ee;font-size:15px;letter-spacing:.22em;text-indent:.22em;text-shadow:0 0 10px rgba(255,140,190,.85),0 0 22px rgba(255,140,190,.45);
 opacity:0;transition:opacity 1.2s}
#hint.on{opacity:1;animation:breath 2.8s ease-in-out infinite}
#hint small{display:block;margin-top:9px;font-size:11px;letter-spacing:.18em;color:rgba(250,215,225,.5);text-shadow:none}
@keyframes breath{0%,100%{opacity:.45}50%{opacity:1}}
#mc2{position:fixed;left:0;right:0;top:calc(6.5vh + env(safe-area-inset-top));text-align:center;z-index:2;pointer-events:none;
 font-family:Georgia,"Times New Roman",serif;font-style:italic;color:#f1d3b1;font-size:clamp(20px,6vw,34px);letter-spacing:.14em;
 text-shadow:0 0 16px rgba(255,160,195,.6);opacity:0;transition:opacity 2s}
#mc2.on{opacity:.85}
#ctl{position:fixed;top:calc(12px + env(safe-area-inset-top));right:12px;z-index:4;display:flex;gap:10px;opacity:0;transition:opacity 1s}
#ctl.on{opacity:1}
#ctl div{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;
 background:rgba(255,200,215,.08);border:1px solid rgba(255,210,220,.22);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#ctl svg{width:18px;height:18px;stroke:#f6dcc8;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>

/* ---------- UI ---------- */
var hint=document.getElementById('hint'),ctl=document.getElementById('ctl');

 if(AC){if(AC.state==='running'){finishUnlock();}else if(AC.resume){AC.resume().then(finishUnlock).catch(function(){});}}}
['pointerdown','touchstart','touchend','click','keydown'].forEach(function(ev){window.addEventListener(ev,unlock,true);});

['pointerdown','pointerup','touchstart','touchend','mousedown','mouseup'].forEach(function(ev){ctl.addEventListener(ev,stop);});
